apply plugin: 'com.android.application'

/*
 * D-34 release signing.
 *
 * The keystore and its passwords live OUTSIDE this repository and are never
 * committed, never printed, and never pasted into a chat. This file reads them
 * from a properties file whose path is itself outside the tree:
 *
 *     C:\DEV\_cnc-keys\keystore.properties
 *
 * containing:
 *     storeFile=C:\\DEV\\_cnc-keys\\commandpost.jks
 *     storePassword=...
 *     keyAlias=commandpost
 *     keyPassword=...
 *
 * If that file is absent the release build still configures and compiles - it
 * simply produces an unsigned APK. A missing keystore must not break the build
 * for anyone who clones this repo, and it must fail visibly rather than
 * silently substituting the debug key, which would be worse than not signing.
 */
def keystorePropsFile = file("${System.getenv('CNC_KEYSTORE_PROPS') ?: 'C:/DEV/_cnc-keys/keystore.properties'}")
def keystoreProps = new Properties()
def haveKeystore = false

if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
    def ks = file(keystoreProps['storeFile'] ?: '')
    if (ks.exists()) {
        haveKeystore = true
        println "Release signing: using keystore at ${ks.absolutePath}"
    } else {
        println "Release signing: keystore.properties found but storeFile does not exist - release will be UNSIGNED"
    }
} else {
    println "Release signing: no keystore.properties at ${keystorePropsFile} - release will be UNSIGNED"
}

android {
    namespace "dev.pricharda.commandpost"
    compileSdkVersion 34
    ndkVersion "26.3.11579264"

    defaultConfig {
        applicationId "dev.pricharda.commandpost"
        minSdkVersion 21
        targetSdkVersion 34
        // D-43: first real release. versionCode must increment on EVERY future
        // upload - Android rejects a build whose code is not higher than the
        // one already installed or published, and it is not derived from
        // versionName, so bumping only the name silently breaks updates.
        versionCode 2
        versionName "1.0"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_APP_PLATFORM=android-21",
                          "-DANDROID_STL=c++_shared"
            }
        }
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            if (haveKeystore) {
                storeFile     file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias      keystoreProps['keyAlias']
                keyPassword   keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            // Only attached when a real keystore was found. Deliberately NOT
            // falling back to the debug key: a debug-signed "release" APK looks
            // shippable and is not, which is a worse failure than an obviously
            // unsigned one.
            if (haveKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
            // Engine root requires cmake_minimum_required(VERSION 3.25); the
            // SDK default 3.22.1 is too old. Deliberately NOT 4.x: CMake 4
            // removes compatibility with cmake_minimum_required below 3.5 and
            // this tree contains sub-projects declaring 3.6.
            version '3.31.6'
        }
    }

    /*
     * Licence text must ship INSIDE the APK, not merely sit in the repo. EA's
     * GPL v3 section 7 term: "Any propagation or conveyance of this program
     * must include this copyright notice and these terms." An APK handed to
     * anyone without these is non-compliant.
     *
     * Copied at build time rather than checked in, so the shipped text can
     * never drift from the authoritative files at the repo root.
     *
     * The output goes to a BUILD directory, not src/main/assets. The first
     * version wrote into the source tree and the release build failed on it:
     *
     *   Task ':app:lintVitalAnalyzeRelease' uses this output of task
     *   ':app:copyLicenceAssets' without declaring an explicit or implicit
     *   dependency.
     *
     * Generated files do not belong in a source directory. Every task that
     * reads src/main/assets would need to declare a dependency on the
     * generator, which is a trap for anything added later. Registering a
     * generated directory as an extra asset source instead means Gradle infers
     * the dependency from the task's declared output, and the debug build's
     * apparent success was only luck of task ordering.
     */
    sourceSets {
        main {
            assets.srcDirs += "${layout.buildDirectory.get()}/generated/licenceAssets"
        }
    }

    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
            .dependsOn("copyLicenceAssets")
    }

    lint {
        abortOnError false
    }
}

/*
 * Lint also reads the asset directories, and adding a generated directory to
 * assets.srcDirs as a plain path carries no information about which task
 * produced it. Gradle's validation therefore rejects the release build:
 *
 *   Task ':app:lintVitalAnalyzeRelease' uses this output of task
 *   ':app:copyLicenceAssets' without declaring an explicit or implicit
 *   dependency.
 *
 * This is Gradle's own suggested solution 2, applied to every lint task rather
 * than only the one that happened to fail. lintVitalAnalyzeRelease was the
 * first to complain, but lintAnalyzeDebug and the rest read the same directory
 * and would fail the same way the moment anyone ran them.
 *
 * Matched by name rather than listed, because the set of lint tasks is created
 * per variant by AGP and hardcoding today's names would break when a variant
 * is added.
 */
tasks.matching { it.name.startsWith("lint") }.configureEach {
    dependsOn("copyLicenceAssets")
}

tasks.register('copyLicenceAssets', Copy) {
    from("${rootDir}/..") {
        include 'License.txt'
        include 'THIRD-PARTY-LICENSES.txt'
    }
    into layout.buildDirectory.dir("generated/licenceAssets")
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
