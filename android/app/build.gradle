apply plugin: 'com.android.application'

android {
    namespace "dev.pricharda.vc95"
    compileSdkVersion 34
    ndkVersion "26.3.11579264"

    defaultConfig {
        applicationId "dev.pricharda.vc95"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "0.1-gate2"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_APP_PLATFORM=android-21",
                          "-DANDROID_STL=c++_shared"
            }
        }
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
            // Engine root requires cmake_minimum_required(VERSION 3.25); the
            // SDK default 3.22.1 is too old. Deliberately NOT 4.x: CMake 4
            // removes compatibility with cmake_minimum_required below 3.5 and
            // this tree contains sub-projects declaring 3.6.
            version '3.31.6'
        }
    }

    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
